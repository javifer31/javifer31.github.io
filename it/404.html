<title>Pagina non trovata (404) · Solved</title>
<script>
/* Rescate de URLs rotas de enlaces externos/antiguos y del índice de Google.
   1) Alias y variantes de páginas del sitio: /kpis/ → /dashboard/ (las rutas
      canónicas /incidencias/, /auditorias/… ya existen y no llegan aquí)
      (también las que llevan guion, que antes caían en el rescate de blog y
      acababan en un 404 de /blog/).
   2) Artículos sin el prefijo /blog/: /{slug-con-guiones}/ → /blog/{slug}/.
   Guardas anti-bucle: no actúa dentro de /blog/, y nunca redirige a la misma
   ruta que ya se está pidiendo (si /incidencias/ llegase a faltar, se muestra
   el 404 en vez de rebotar contra sí misma indefinidamente). */
(function () {
  var p = location.pathname;
  if (p.indexOf('/blog/') === 0) return;
  var seg = p.replace(/^\/+|\/+$/g, '').split('/');
  if (seg.length !== 1 || /\.[a-z0-9]+$/i.test(seg[0])) return;
  var one = seg[0].toLowerCase();

  /* Páginas estáticas (mismos alias que scripts/lib/links.mjs). */
  var STATIC = {
    'incidencias': '/incidencias/',
    'auditorias': '/auditorias/',
    'registros-y-auditorias': '/auditorias/',
    'registros-auditorias': '/auditorias/',
    'dashboard': '/dashboard/',
    'kpis': '/dashboard/',
    'kpis-y-dashboards': '/dashboard/',
    'industria-alimentaria': '/industria-alimentaria/',
    'industria-general': '/industria-general/',
    'politica-de-cookies': '/politica-de-cookies/',
    'politica-de-privacidad': '/politica-de-privacidad/'
  };
  /* Alias que no tienen página propia. */
  var DEMO = ['demo', 'solicitar-demo', 'pedir-demo', 'solicita-una-demo', 'solicita-demo',
    'prueba-gratis', 'prueba-gratuita', 'contacto', 'contactar', 'contacta'];
  var HOME = ['funcionalidades', 'caracteristicas', 'producto', 'productos',
    'casos-de-exito', 'casos-exito', 'clientes', 'precios', 'pricing', 'planes', 'soluciones'];

  if (STATIC[one]) {
    if (STATIC[one] === p) return;   // ya estamos ahí: no rebotar
    location.replace(STATIC[one] + location.hash); return;
  }
  if (DEMO.indexOf(one) !== -1) { location.replace('/#contacto'); return; }
  if (HOME.indexOf(one) !== -1) { location.replace('/'); return; }

  if (/-/.test(one)) location.replace('/blog/' + seg[0] + '/' + location.hash);
})();
</script>
